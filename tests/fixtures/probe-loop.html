<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch Party probe page - the loop</title>
<style>
  body { margin: 0; padding: 16px; background: #14151a; color: #e8e8ea; font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 12px 0 4px; }
  #leaving { font-family: ui-monospace, monospace; color: #8fd; }
</style>
</head>
<body>
<h1>Watch Party probe page - the loop</h1>
<p id="leaving">leaving 0</p>
<script>
  // A site that redirects itself: every load bumps ?n= by one and leaves again,
  // once, with location.replace, so a page the room puts back leaves again on
  // its own (T147, ADR-048). Nothing here is timed and nothing leaves this
  // origin: the next address is this one with a larger n. The text is written
  // after the replace call, so a load whose navigation is refused still says
  // which one it was.
  var n = Number(new URLSearchParams(location.search).get('n') || '0') + 1
  var next = new URL(location.href)
  next.searchParams.set('n', String(n))
  location.replace(next.href)
  document.getElementById('leaving').textContent = 'leaving ' + n
  document.title = 'Watch Party probe page - leaving ' + n
</script>
</body>
</html>
